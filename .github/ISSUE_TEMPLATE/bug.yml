name: Bug
description: 缺陷修复
title: '[Bug] '
labels:
  - bug
body:
  - type: textarea
    id: current
    attributes:
      label: 现状
      description: 实际发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 应该发生什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 命令 / 路径 / 环境
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围与修复边界
    validations:
      required: true
