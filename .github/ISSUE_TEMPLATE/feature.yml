name: Feature
description: 新功能开发
title: "[Feat] "
labels:
  - feature
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么要做？当前的问题或缺口是什么？
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
    validations:
      required: true
  - type: textarea
    id: non_goal
    attributes:
      label: 非目标
      description: 本次明确不做的事，避免范围漂移
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 改动范围
      description: 涉及的应用 / layer / 目录 / 文件
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可勾选的完成标准
    validations:
      required: true
  - type: textarea
    id: test_plan
    attributes:
      label: 测试计划
      description: 机器验（命令）与意图验（页面 / 接口路径）分别怎么做
    validations:
      required: true
  - type: input
    id: dao_task
    attributes:
      label: 关联任务卡
      placeholder: dao/tasks/DAO-00X-*.md
    validations:
      required: false
